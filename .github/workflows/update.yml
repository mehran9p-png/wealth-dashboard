name: Update Market Prices

on:
  schedule:
    - cron: '30 12 * * 0,1,2,3,6'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-prices:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install requests
        run: pip install requests urllib3

      - name: Run price updater script
        run: python scripts/update_prices.py || true

      - name: Commit and Push safely (Never Fail)
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add data/prices.json data/history.json || true
          if git diff --staged --quiet; then
            echo "No changes to commit."
          else
            git commit -m "chore: auto update prices [skip ci]" || true
            git pull --rebase -X theirs origin main || true
            git push origin HEAD:main || true
          fi
          
